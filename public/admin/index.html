
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
  <script>
    CMS.init({
        config: {
            backend: {
                name: "git-gateway",
                branch: "main",
            },
            media_folder: "public/images/uploads",
            public_folder: "/images/uploads",
            collections: [
                {
                    name: "books",
                    label: "Books",
                    folder: "content/books",
                    create: true,
                    slug: "{{fields.slug}}",
                    extension: "json",
                    fields: [
                        { label: "Title", name: "title", widget: "string" },
                        { label: "Slug", name: "slug", widget: "string" },
                        { label: "Author", name: "author", widget: "string" },
                        { label: "Price (XAF)", name: "price", widget: "number" },
                        { label: "Category", name: "category", widget: "relation", collection: "categories", search_fields: ["name"], value_field: "slug", display_fields: ["name"] },
                        { label: "Stock", name: "stock", widget: "number", default: 1 },
                        { label: "Cover Image", name: "image", widget: "image" },
                        { label: "Description", name: "description", widget: "markdown" },
                    ],
                },
                {
                    name: "categories",
                    label: "Categories",
                    folder: "content/categories",
                    create: true,
                    slug: "{{fields.slug}}",
                    extension: "json",
                    fields: [
                        { label: "Name", name: "name", widget: "string" },
                        { label: "Slug", name: "slug", widget: "string" },
                        { label: "Description", name: "description", widget: "markdown", optional: true },
                        { label: "Image", name: "image", widget: "image", optional: true },
                    ],
                },
            ],
        },
    });
  </script>
</body>
</html>
